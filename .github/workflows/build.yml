# Builds leftseat.vpk on GitHub every time you push, and attaches it to a Release when you push a tag like v1.0.
name: Build VPK

on:
  push:
    branches: [ main, master, galactic-detour ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: "Which app to build: auto picks Galactic Detour for galactic-detour and pull requests into it"
        type: choice
        options: [ auto, left-seat, galactic-detour ]
        default: auto

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check VitaSDK and libraries
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          echo "VITASDK = $VITASDK"
          if [ ! -f "$VITASDK/arm-vita-eabi/include/vita2d.h" ]; then
            echo "vita2d is missing from this image, installing it with vdpm"
            git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
            (cd /tmp/vdpm && ./vdpm vita2d freetype libpng libjpeg-turbo zlib)
          fi
          ls "$VITASDK/arm-vita-eabi/include/vita2d.h"

      - name: Pick the app to build
        id: ed
        env:
          WANT: ${{ inputs.edition || 'auto' }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref_name }}
        run: |
          # Galactic Detour is its own app (its own title ID, name and icon), so it installs beside Left Seat.
          if [ "$WANT" = "galactic-detour" ] || { [ "$WANT" = "auto" ] && { [ "$BASE" = "galactic-detour" ] || [ "$REF" = "galactic-detour" ]; }; }; then
            echo "flags=-DLS_DETOUR=ON" >> "$GITHUB_OUTPUT"
            echo "artifact=galactic-detour-vpk" >> "$GITHUB_OUTPUT"
            echo "file=leftseat-galactic-detour.vpk" >> "$GITHUB_OUTPUT"
            echo "Building: Left Seat: Galactic Detour (SKYH00002)"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "artifact=leftseat-vpk" >> "$GITHUB_OUTPUT"
            echo "file=leftseat.vpk" >> "$GITHUB_OUTPUT"
            echo "Building: Left Seat (SKYH00001)"
          fi

      - name: Build the VPK
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          mkdir build
          cd build
          cmake ${{ steps.ed.outputs.flags }} ..
          bash ../fixpad.sh
          [ "${{ steps.ed.outputs.file }}" = leftseat.vpk ] || cp leftseat.vpk "${{ steps.ed.outputs.file }}"
          ls -l *.vpk

      - name: Upload the VPK (Actions tab -> the run -> Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ed.outputs.artifact }}
          path: build/${{ steps.ed.outputs.file }}
          if-no-files-found: error

      - name: Attach the VPK to the Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/leftseat.vpk
