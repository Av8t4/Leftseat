# Publishes a release with leftseat.vpk attached. Run it by hand: Actions tab > Release > Run workflow, then pick
#   patch = a small fix        (v1.1   -> v1.1.1,  v1.1.1 -> v1.1.2)
#   minor = new features       (v1.1.2 -> v1.2)
#   major = a big new version  (v1.2   -> v2.0)
# It works out the next number from the latest tag, builds, tags the commit and writes the release notes: whatever you
# type in the Notes box, followed by GitHub's automatic list of changes.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "What kind of release? patch = small fix, minor = new features, major = big change"
        type: choice
        options: [ patch, minor, major ]
        default: patch
      notes:
        description: "Your release notes (optional). Type \\n for a new line. They go above the automatic list of changes"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # needs the existing tags to count from

      - name: Work out the next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+(\.[0-9]+){0,2}$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$latest" ]; then
            next="1.0"                # nothing released yet
          else
            IFS=. read -r maj min pat <<< "$latest"
            min=${min:-0}; pat=${pat:-0}
            case "$BUMP" in
              major) next="$((maj + 1)).0" ;;
              minor) next="$maj.$((min + 1))" ;;
              *)     next="$maj.$min.$((pat + 1))" ;;
            esac
          fi
          echo "Latest tag: ${latest:-none}   ->   new tag: v$next"
          if git rev-parse "v$next" >/dev/null 2>&1; then echo "v$next already exists"; exit 1; fi
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "major=${next%%.*}" >> "$GITHUB_OUTPUT"
          rest=${next#*.}
          echo "minor=${rest%%.*}" >> "$GITHUB_OUTPUT"

      - name: Build leftseat.vpk
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          if [ ! -f "$VITASDK/arm-vita-eabi/include/vita2d.h" ]; then
            git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
            (cd /tmp/vdpm && ./vdpm vita2d freetype libpng libjpeg-turbo zlib)
          fi
          # show the version on the Vita too (it only has room for major.minor, e.g. 01.02)
          v=$(printf '%02d.%02d' "${{ steps.ver.outputs.major }}" "${{ steps.ver.outputs.minor }}")
          sed -i "s/set(VITA_VERSION .*/set(VITA_VERSION  \"$v\")/" CMakeLists.txt
          grep VITA_VERSION CMakeLists.txt | head -1
          mkdir build
          cd build
          cmake ..
          bash ../fixpad.sh
          ls -l leftseat.vpk

      - name: Write your notes
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%b\n' "$NOTES" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Left Seat ${{ steps.ver.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: build/leftseat.vpk
